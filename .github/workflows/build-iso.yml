name: Build Custom ISO (Unattended)

# This enables the manual "Run workflow" trigger button on GitHub
on:
  workflow_dispatch:

jobs:
  compile-iso:
    runs-on: ubuntu-latest

    # Ensure the builder writes into the repository workspace so upload-artifact can find it
    env:
      UVB_OUTPUT_DIR: ${{ github.workspace }}/output

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Maximize Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/libexec/docker

      - name: Install ISO Tooling Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap squashfs-tools xorriso x11-xserver-utils isolinux syslinux-common

      - name: Run Script Non-Interactively
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh --advanced -

      # Debug / sanity-check — show where the ISO ended up (helpful for troubleshooting)
      - name: List workspace and output directory
        run: |
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          echo "Checking workspace root:"
          ls -la "$GITHUB_WORKSPACE" || true
          echo "Checking $GITHUB_WORKSPACE/output:"
          ls -la "$GITHUB_WORKSPACE/output" || true

      - name: Upload Finalized ISO
        uses: actions/upload-artifact@v4
        with:
          name: custom-ubuntu-vanilla
          path: |
            output/*.iso
          if-no-files-found: error
