# Quick sanity check (no ISO build).
name: Validate scripts

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Bash syntax
        run: bash -n scripts/build.sh && bash -n scripts/default_config.sh && bash -n scripts/ci/render-config.sh

      - name: ShellCheck (optional)
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck || true
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck -x scripts/build.sh scripts/ci/render-config.sh || true
          fi
