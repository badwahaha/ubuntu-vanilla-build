---
# SPDX-License-Identifier: MIT
# No GeoIP; curated /usr/share/i18n/SUPPORTED from scripts/calamares/i18n/SUPPORTED.
region: "America"
zone: "New_York"
# Prefer the live session timezone instead of a fixed default.
useSystemTimezone: true
# Do not call timedatectl on every map click in the live environment.
adjustLiveTimezone: false
# GeoIP is omitted intentionally (upstream default hits the network via geoip.kde.org).
