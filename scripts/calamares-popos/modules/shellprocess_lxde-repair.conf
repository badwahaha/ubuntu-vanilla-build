# If LXDE session files are missing after unpack (Openbox-only login), reinstall lxde when online.
---
dontChroot: false
timeout: 900
script:
  - |
      bash -ec '
      # LXDE/Openbox ISO heuristic: skip GNOME/XFCE/etc.
      if ! dpkg -s openbox >/dev/null 2>&1; then
        exit 0
      fi
      # LXDE already present
      if dpkg -s lxde >/dev/null 2>&1 && [ -f /usr/share/xsessions/LXDE.desktop ]; then
        exit 0
      fi
      export DEBIAN_FRONTEND=noninteractive
      if ! apt-get -o Acquire::http::Timeout=15 -o Acquire::ftp::Timeout=15 update; then
        echo "LXDE repair: apt-get update failed (offline?). Skipping lxde install." >&2
        exit 0
      fi
      apt-get install -y --no-install-recommends lxde || echo "LXDE repair: apt-get install lxde failed." >&2
      exit 0
      '
