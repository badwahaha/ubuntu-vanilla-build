---
# No GeoIP; do not require network (offline installs).
showSupportUrl: false
showKnownIssuesUrl: false
showReleaseNotesUrl: false
showDonateUrl: false

# Minimums refreshed for current Ubuntu releases (24.04/26.04 recommend
# 25 GB disk / 4 GB RAM): the old 8 GiB / 0.5 GiB figures predate that and
# let installs start on disks the unpacked squashfs cannot actually fit.
# Kept below Canonical's "recommended" values so lightweight desktop builds
# (LXDE/LXQt/XFCE) still install on modest hardware.
requirements:
  requiredStorage: 15
  requiredRam: 2
  check:
    - storage
    - ram
    - power
    - root
  required:
    - root
    - storage
    - ram
