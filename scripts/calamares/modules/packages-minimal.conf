---
# Minimal-variant package operations.
#
# The minimal target system installs an explicit no-snap approximation of
# ubuntu-server-minimal in the chroot before squashfs, so it ships in the
# unpacked target automatically. The live ISO additionally carries a tiny X
# stack (xorg + openbox + lightdm + nm-applet + xterm + dejavu fonts) just so
# the Calamares GUI can render during install. The remove list below strips
# that live-only X stack from the installed system, plus the installer itself
# and the live helpers, leaving a text-console target with no DE or display
# manager.
update_db: true
backend: apt
operations:
  - remove:
      - "^live-*"
      - calamares
      - casper
      - cifs-utils
      - discover
      - laptop-detect
      - os-prober
      # Live-only X stack (kept on the ISO so Calamares can render).
      - xserver-xorg
      - xserver-xorg-core
      - "^xserver-xorg-input-.*"
      - "^xserver-xorg-video-.*"
      - xinit
      - x11-xserver-utils
      - openbox
      - lightdm
      - lightdm-gtk-greeter
      - accountsservice
      - dbus-x11
      - network-manager-gnome
      - xterm
      - fonts-dejavu-core
      # GParted is a GUI partition tool; the minimal/server target is text-only.
      - gparted
  - try_install:
      - language-pack-$LOCALE
      - hunspell-$LOCALE
