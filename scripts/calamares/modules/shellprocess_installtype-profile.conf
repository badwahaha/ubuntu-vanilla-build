---
dontChroot: false
timeout: 1800
script:
  - |
      bash -ec '
      INSTALL_TYPE="${gs[packagechooser_installtype]}"
      if [ "$INSTALL_TYPE" != "minimal" ]; then
        echo "Install type: full (or unset). Keeping desktop profile from the live image."
        exit 0
      fi

      echo "Install type: minimal. Applying core + networking profile."
      export DEBIAN_FRONTEND=noninteractive

      apt-get update
      apt-get install -y --no-install-recommends \
        netplan.io \
        network-manager \
        network-manager-gnome \
        wpasupplicant \
        wireless-regdb

      apt-get purge -y --ignore-missing \
        vanilla-gnome-desktop \
        gnome-shell \
        gdm3 \
        xfce4 \
        xfce4-goodies \
        lxde \
        lxqt \
        mate-desktop-environment \
        mate-desktop-environment-core \
        mate-desktop-environment-extras \
        cinnamon-desktop-environment \
        budgie-desktop-environment \
        kde-full \
        kde-standard \
        kde-plasma-desktop \
        ubuntustudio-audio \
        ubuntustudio-graphics \
        ubuntustudio-photography \
        ubuntustudio-publishing \
        ubuntustudio-video \
        ubuntustudio-wallpapers \
        ubuntustudio-menu \
        ubuntu-edu-music \
        xorg \
        lightdm \
        slick-greeter \
        sddm

      apt-get autoremove -y --purge
      apt-get clean
      '
