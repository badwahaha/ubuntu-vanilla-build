---
# Vanilla Ubuntu — Calamares automated ("Erase disk and install") partitioning.
#
# Default layout created on the target disk (GPT partition table):
#   1) 1 MiB    BIOS boot partition  — bios_grub; auto-created by Calamares on
#               legacy/BIOS firmware so GRUB can embed core.img (hybrid boot).
#   2) 512 MiB  EFI System Partition — created on UEFI firmware, mounted at
#               /boot/efi.
#   3) 4 GiB    swap                 — dedicated partition (encrypted together
#               with root when LUKS is selected).
#   4) remainder root (/)            — fills the rest of the disk.
#
# On UEFI the 512 MiB ESP is created; on legacy BIOS the 1 MiB bios_grub
# partition is created instead — matching this image's hybrid UEFI+BIOS boot.

# Force GPT as the default partition table on both UEFI and BIOS installs.
# On BIOS/GPT, Calamares automatically adds the 1 MiB bios_grub partition that
# GRUB needs to embed its core image.
defaultPartitionTableType: gpt

# 512 MiB EFI System Partition, mounted at /boot/efi on UEFI systems.
efiSystemPartition: "/boot/efi"
efiSystemPartitionSize: 512MiB

# Full-disk encryption offered straight from the partitioning step.
enableLuksAutomatedPartitioning: true
luksGeneration: luks2

# Swap is a dedicated 4 GiB partition in the layout below, so the automated
# swap-file / swap-choice logic is disabled to avoid creating a second swap.
userSwapChoices:
  - none
initialSwapChoice: none

drawNestedPartitions: true
defaultFileSystemType: "ext4"
availableFileSystemTypes: ["ext4", "btrfs", "xfs"]

partitionLayout:
  # Unencrypted /boot, present only when LUKS full-disk encryption is chosen,
  # so GRUB can read kernels/initrds before the LUKS volume is unlocked.
  - name: "vanilla_boot"
    filesystem: ext4
    noEncrypt: true
    onlyPresentWithEncryption: true
    mountPoint: "/boot"
    size: 4G
  # 4 GiB swap partition (encrypted together with root when LUKS is selected).
  - name: "vanilla_swap"
    filesystem: linuxswap
    size: 4G
  # Root fills the remaining space.
  - name: "vanilla_root"
    filesystem: unknown
    mountPoint: "/"
    size: 100%
