---
# Strip live-only and installer packages from the target system after unpack.
update_db: true
backend: apt
operations:
  # Exact package names only. The old "^live-*" pattern was inherited from
  # Debian-live configs: Ubuntu's live session uses casper, no live-* packages
  # exist here, and as an apt regex it would match any package starting with
  # "live". Dropped as inaccurate.
  - remove:
      - calamares
      - casper
      - cifs-utils
      - discover
      - laptop-detect
      - os-prober
  - try_install:
      - language-pack-$LOCALE
      - hunspell-$LOCALE
      - libreoffice-help-$LOCALE
      - libreoffice-l10n-$LOCALE

