---
extraMounts:
  - device: proc
    fs: proc
    mountPoint: /proc
  - device: sys
    fs: sysfs
    mountPoint: /sys
  - device: /dev
    mountPoint: /dev
    options: [bind]
  - device: tmpfs
    fs: tmpfs
    mountPoint: /run
  - device: /run/udev
    mountPoint: /run/udev
    options: [bind]
  - device: efivarfs
    fs: efivarfs
    mountPoint: /sys/firmware/efi/efivars
    efi: true
  - device: /run/systemd/resolve
    mountPoint: /run/systemd/resolve
    options: [bind]

# Mount options refreshed: the old set (btrfs autodefrag + compress=lzo,
# per-filesystem 'discard') reflects pre-2020 advice. Modern kernels prefer
# zstd compression for btrfs, autodefrag is discouraged on SSDs, and
# continuous 'discard' is superseded by periodic TRIM (Ubuntu ships
# fstrim.timer enabled by default via util-linux).
mountOptions:
  - filesystem: default
    options: [defaults]
  - filesystem: btrfs
    options: [defaults, noatime, compress=zstd:1]
