# SPDX-License-Identifier: MIT
# Workaround for LP#1829805 (update-initramfs skips kernels without an
# existing /boot/initrd.img-* file on the target). Still shipped by
# calamares-settings-ubuntu today; runs before the initramfs module.
---
dontChroot: false
timeout: 30
script:
  - "touch ${ROOT}/boot/initrd.img-$(uname -r)"
