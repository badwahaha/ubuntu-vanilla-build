# SPDX-License-Identifier: MIT
# Minimal-variant Calamares sequence for the Ubuntu vanilla live ISO.
#
# Same modules as scripts/calamares/settings.conf, except the `displaymanager`
# exec step is removed: the minimal target has no DE and no display manager,
# so configuring one would either fail or leave a dead unit on the installed
# system. The X stack on the live ISO (xorg + openbox + lightdm) is also
# stripped from the target by the `packages` module, which on this build is
# overlaid from packages-minimal.conf.
---
modules-search: [ local ]

instances:
  - id: bug-LP#1829805
    module: shellprocess
    config: shellprocess_bug-LP#1829805.conf

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - luksbootkeyfile
      - users
      - networkcfg
      - hwclock
      - shellprocess@bug-LP#1829805
      - initramfscfg
      - initramfs
      - grubcfg
      - bootloader
      - packages
      - umount
  - show:
      - finished

branding: ubuntu
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
